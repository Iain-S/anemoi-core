name: Type Checking

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
#  UV_SYSTEM_PYTHON: 1

jobs:
  ty:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest"]
        python-version: ["3.12"]
        package: ["graphs", "models", "training"]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.19

      - name: Install packages
        run: |
          # Install all packages from local
          uv venv
          uv pip install ./training[typing] ./graphs[typing] ./models[typing]

      - name: Run ty typing for ${{ matrix.package }}
        run: |
          uv run ty check
             --config-file ./${{ matrix.package }}/ty.toml
             --python "$(which python)"
             ./${{ matrix.package }}/src/

name: Type Checking

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  ty:
    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest"]
        python-version: ["3.12"]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.19

      - name: Install packages
        run: |
          # Install all packages from local
          uv pip install ./training[all] ./graphs[all,typing] ./models[all,typing]

      - name: Run ty typing for models
        run: |
          uv run ty check ./models --config-file ./models/ty.toml

      - name: Run ty typing for graphs
        run: |
          uv run ty check ./graphs --config-file ./graphs/ty.toml
